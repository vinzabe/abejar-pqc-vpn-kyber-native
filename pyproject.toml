[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pqc-scanner"
version = "1.0.0"
description = "Post-quantum readiness scanner: inventories quantum-vulnerable cryptography across certificates, config, and code — including where it hides in pinned certs and hardcoded keys — and sequences a migration with progress tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vinzabe", email = "gabejar@usa.com" }]
keywords = ["security", "cryptography", "post-quantum", "pqc", "compliance", "crypto-agility"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "mypy>=1.8", "ruff>=0.5"]

[project.scripts]
pqcscan = "pqcscan.cli:main"

[project.urls]
Homepage = "https://github.com/vinzabe/pqc-scanner"
Issues = "https://github.com/vinzabe/pqc-scanner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pqcscan"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pqcscan"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "S101", "ARG001", "ARG002", "ARG005", "F841"]
